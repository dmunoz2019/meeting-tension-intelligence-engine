name: CI

on:
  push:
    branches: [main, feature/state-of-art-architecture]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,nlp]'
      - run: ruff check .
      - name: Type-check domain, ports, retrieval, evaluation and upstream registry
        run: >-
          python -m mypy --follow-imports=skip
          src/meeting_intelligence/domain
          src/meeting_intelligence/ports.py
          src/meeting_intelligence/retrieval
          src/meeting_intelligence/evaluation
          src/meeting_intelligence/upstreams.py
      - name: Type-check optional adapters
        run: >-
          python -m mypy --follow-imports=skip --ignore-missing-imports
          src/meeting_intelligence/adapters
      - run: meeting-intelligence upstreams verify
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: meeting-intelligence upstreams verify
      - run: meeting-intelligence analyze examples/synthetic_meeting.md --output-dir smoke-output
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
