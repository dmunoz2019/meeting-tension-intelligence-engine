[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-tension-intelligence"
version = "0.2.0"
description = "Privacy-first adaptive NLP and evidence-based meeting intelligence engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Sherpax Group LLC" }]
keywords = [
  "meeting-intelligence",
  "nlp",
  "sentiment-analysis",
  "mcp",
  "requirements-engineering",
  "erp",
  "conversation-intelligence",
  "speaker-diarization",
  "hybrid-retrieval",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
nlp = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
]
mcp = ["mcp>=1.28,<2"]
audio-faster-whisper = ["faster-whisper>=1.2.1,<2"]
audio-whisperx = ["whisperx>=3.8.6,<4"]
diarization = ["pyannote.audio>=4.0.7,<5"]
privacy = [
  "presidio-analyzer>=2.2.363,<3",
  "presidio-anonymizer>=2.2.363,<3",
]
retrieval-bge = ["FlagEmbedding>=1.4,<2"]
postgres = [
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
]
observability = [
  "opentelemetry-api>=1.43,<2",
  "opentelemetry-sdk>=1.43,<2",
]
mlops = ["mlflow>=3.14,<4"]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7,<1",
  "mypy>=1.12,<2",
  "build>=1.2,<2",
]

[project.scripts]
meeting-intelligence = "meeting_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_intelligence = ["vendor/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
  "faster_whisper",
  "faster_whisper.*",
  "pyannote",
  "pyannote.*",
  "presidio_analyzer",
  "presidio_analyzer.*",
  "presidio_anonymizer",
  "presidio_anonymizer.*",
]
ignore_missing_imports = true
