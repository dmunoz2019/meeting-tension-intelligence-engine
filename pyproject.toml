[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-tension-intelligence"
version = "0.1.0"
description = "Privacy-first adaptive regex, NLP, sentiment, and MCP engine for meeting tension intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Sherpax Group LLC" }
]
keywords = [
  "meeting-intelligence",
  "nlp",
  "sentiment-analysis",
  "mcp",
  "requirements-engineering",
  "erp",
  "conversation-intelligence"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
nlp = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
]
mcp = [
  "mcp>=1.28,<2",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
meeting-intelligence = "meeting_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
